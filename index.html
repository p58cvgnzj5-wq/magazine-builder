<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Magazine Builder</title>
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0 }
  html, body { height:100% }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background:#1a1a2e; color:#e0e0e0; overflow:hidden; height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button, label, select, input, .template, .gallery-item, .thumb, .bgopt, .swatch { touch-action:manipulation }
  button { font-family:inherit }
  button:disabled { opacity:.4 }

  /* HEADER */
  #header {
    display:flex; align-items:center; gap:8px; padding:6px 12px;
    background:#16213e; border-bottom:1px solid #0f3460; min-height:56px; flex-shrink:0;
    overflow-x:auto; -webkit-overflow-scrolling:touch;
  }
  #header h1 { font-size:18px; font-weight:700; color:#e94560; white-space:nowrap }
  .spacer { flex:1; min-width:4px }
  #header button, #footer button, #sel-toolbar button, #strip button, .side-btn {
    min-height:44px; min-width:44px; padding:6px 12px; border:none; border-radius:6px; cursor:pointer;
    font-size:14px; font-weight:600; white-space:nowrap; flex-shrink:0;
  }
  .btn-page { background:#0f3460; color:#e0e0e0 }
  .btn-page:hover { background:#1a4a7a }
  .btn-export { background:#e94560; color:#fff }
  .btn-export:hover { background:#c73650 }
  #page-indicator { font-size:13px; color:#aaa; min-width:80px; text-align:center; white-space:nowrap }
  #sidebar-toggle { display:none }

  /* MAIN */
  #main { display:flex; flex:1; overflow:hidden; position:relative; min-height:0 }

  /* SIDEBAR */
  #sidebar {
    width:270px; flex-shrink:0; background:#16213e; border-right:1px solid #0f3460;
    display:flex; flex-direction:column; overflow-y:auto; padding:12px; -webkit-overflow-scrolling:touch;
  }
  #sidebar h3 { font-size:13px; text-transform:uppercase; letter-spacing:1px; color:#999; margin:18px 0 8px }
  #sidebar h3:first-child { margin-top:0 }
  #upload-zone {
    display:block; border:2px dashed #0f3460; border-radius:10px; padding:20px 12px; min-height:60px;
    text-align:center; cursor:pointer; color:#888; font-size:13px; margin-bottom:8px;
  }
  #upload-zone:hover, #upload-zone.dragover { border-color:#e94560; color:#e94560 }
  #file-input { position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none }
  #gallery { display:grid; grid-template-columns:repeat(2,1fr); gap:8px }
  .gallery-item {
    aspect-ratio:1; border-radius:6px; overflow:hidden; cursor:grab; border:2px solid transparent;
    background:#0f3460; position:relative; touch-action:pan-y;
  }
  .gallery-item:hover { border-color:#e94560 }
  .gallery-item img { width:100%; height:100%; object-fit:cover; pointer-events:none; -webkit-user-drag:none }
  .gallery-item .remove {
    position:absolute; top:2px; right:2px; width:22px; height:22px; border-radius:50%;
    background:rgba(0,0,0,.7); color:#fff; border:none; cursor:pointer; font-size:14px; line-height:22px; display:none;
  }
  .gallery-item:hover .remove { display:block }
  .side-row { display:flex; flex-wrap:wrap; gap:6px }
  .side-btn { flex:1; background:#0f3460; color:#e0e0e0 }
  .swatch { width:36px; height:36px; border-radius:6px; border:2px solid #0f3460; cursor:pointer }
  .swatch.on { border-color:#e94560 }
  #bg-color { width:44px; height:36px; border:none; background:none }
  #bg-picker { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:8px }
  .bgopt { aspect-ratio:1; border-radius:4px; border:2px solid #0f3460; overflow:hidden; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:#888; background:#0a0a1a }
  .bgopt.on { border-color:#e94560 }
  .bgopt img { width:100%; height:100%; object-fit:cover; pointer-events:none }
  #drag-ghost { position:fixed; width:90px; height:90px; pointer-events:none; z-index:1000; display:none;
    border-radius:8px; overflow:hidden; opacity:.8; box-shadow:0 6px 20px rgba(0,0,0,.5);
    border:2px solid #e94560; transform:translate(-50%,-50%) }
  #drag-ghost img { width:100%; height:100%; object-fit:cover }
  #templates { display:grid; grid-template-columns:repeat(3,1fr); gap:6px }
  .template { aspect-ratio:3/4; border-radius:4px; cursor:pointer; border:2px solid #0f3460;
    display:flex; align-items:center; justify-content:center; font-size:10px; color:#888;
    background:#0a0a1a; position:relative; overflow:hidden }
  .template:hover { border-color:#e94560 }
  .template .t-line { position:absolute; background:#e94560; opacity:.3; border-radius:1px }
  .template .t-text { position:absolute; background:#fff; opacity:.6; border-radius:1px }
  .template-name { position:relative; z-index:1; background:rgba(0,0,0,.8); padding:2px 4px; border-radius:3px }

  /* SOURCES / GOOGLE PHOTOS */
  .src-btns { display:flex; flex-direction:column; gap:8px; margin-bottom:8px }
  .src-btn { display:flex; align-items:center; justify-content:center; gap:8px; min-height:56px; padding:10px 12px;
    border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; border:2px solid #0f3460; text-align:center }
  #upload-zone.src-btn { background:#0f3460; color:#fff; border-style:dashed; margin:0 }
  #upload-zone.src-btn:hover, #upload-zone.dragover { border-color:#e94560; color:#fff }
  #gp-btn { background:#fff; color:#1f1f1f; border-color:#fff; font-family:inherit }
  #gp-btn:disabled { background:#3a3f55; color:#999; border-color:#3a3f55; cursor:not-allowed; opacity:1 }
  .gp-note { font-size:11px; color:#999; line-height:1.4 }
  #gp-panel { position:fixed; inset:0; z-index:2000; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.6); padding:20px }
  #gp-panel.show { display:flex }
  #gp-box { background:#16213e; border:1px solid #0f3460; border-radius:14px; padding:20px; width:min(420px,100%); box-shadow:0 10px 40px rgba(0,0,0,.6) }
  #gp-box h4 { font-size:17px; margin-bottom:10px; color:#fff }
  #gp-msg { font-size:14px; color:#ccc; line-height:1.45; margin-bottom:12px; white-space:pre-line }
  #gp-msg.err { color:#ff9aa8 }
  #gp-bar { height:8px; border-radius:4px; background:#0f3460; overflow:hidden; margin-bottom:14px; display:none }
  #gp-bar div { height:100%; width:0; background:#e94560; transition:width .2s }
  #gp-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end }
  #gp-actions button, #gp-actions a { min-height:44px; padding:8px 14px; border-radius:8px; border:none; font-size:14px; font-weight:600; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center }
  .gp-primary { background:#e94560; color:#fff } .gp-secondary { background:#0f3460; color:#e0e0e0 }

  /* CANVAS */
  #canvas-wrapper { flex:1; overflow:auto; display:flex; background:#111827; padding:24px; position:relative; min-width:0; -webkit-overflow-scrolling:touch }
  #canvas-container { position:relative; box-shadow:0 4px 40px rgba(0,0,0,.6); margin:auto; flex-shrink:0 }
  #canvas { position:absolute; left:0; top:0; transform-origin:0 0; touch-action:none; --z:1; --hs:12px }
  #grid-ov { position:absolute; inset:0; pointer-events:none; z-index:60; display:none;
    background-image:linear-gradient(rgba(0,0,0,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.06) 1px,transparent 1px);
    background-size:20px 20px }
  #canvas.show-grid #grid-ov { display:block }
  #drop-hint { position:absolute; inset:16px; border:2px dashed #e94560; border-radius:8px; pointer-events:none; display:none;
    align-items:center; justify-content:center; z-index:100; color:#e94560; font-size:18px; font-weight:600; background:rgba(233,69,96,.05) }
  #canvas-container.drag-over #drop-hint { display:flex }

  /* PAGE RENDERING (shared by canvas, thumbnails, print) */
  .pg { position:relative; width:595px; height:842px; overflow:hidden; background:#fff }
  .pg .bgimg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block }
  .el { position:absolute }
  .el .clip { width:100%; height:100%; overflow:hidden; background:#eee }
  .el .clip img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; -webkit-user-drag:none }
  .el .txt { width:100%; height:100%; overflow:hidden; white-space:pre-wrap; overflow-wrap:break-word; line-height:1.15; padding:4px; outline:none }

  /* EDITING UI */
  #canvas .el { cursor:move; touch-action:none }
  #canvas .el.selected { outline:calc(3px / var(--z)) solid #e94560; z-index:40 }
  #canvas .el.cropping { outline:calc(3px / var(--z)) dashed #ffb020 }
  #canvas .el.editing { cursor:text; touch-action:auto }
  #canvas .el.editing .txt { user-select:text; -webkit-user-select:text; outline:calc(1px / var(--z)) dashed #e94560 }
  .handle { position:absolute; width:calc(var(--hs) / var(--z)); height:calc(var(--hs) / var(--z)); z-index:45; touch-action:none }
  .handle::after { content:''; position:absolute; inset:15%; background:#e94560; border:calc(2px / var(--z)) solid #fff; border-radius:2px }
  .h-nw { top:calc(var(--hs) / var(--z) / -2); left:calc(var(--hs) / var(--z) / -2); cursor:nw-resize }
  .h-n  { top:calc(var(--hs) / var(--z) / -2); left:calc(50% - var(--hs) / var(--z) / 2); cursor:n-resize }
  .h-ne { top:calc(var(--hs) / var(--z) / -2); right:calc(var(--hs) / var(--z) / -2); cursor:ne-resize }
  .h-e  { top:calc(50% - var(--hs) / var(--z) / 2); right:calc(var(--hs) / var(--z) / -2); cursor:e-resize }
  .h-se { bottom:calc(var(--hs) / var(--z) / -2); right:calc(var(--hs) / var(--z) / -2); cursor:se-resize }
  .h-s  { bottom:calc(var(--hs) / var(--z) / -2); left:calc(50% - var(--hs) / var(--z) / 2); cursor:s-resize }
  .h-sw { bottom:calc(var(--hs) / var(--z) / -2); left:calc(var(--hs) / var(--z) / -2); cursor:sw-resize }
  .h-w  { top:calc(50% - var(--hs) / var(--z) / 2); left:calc(var(--hs) / var(--z) / -2); cursor:w-resize }
  .rot { position:absolute; z-index:45; touch-action:none; cursor:grab; border-radius:50%;
    width:calc(var(--hs) / var(--z) + 8px / var(--z)); height:calc(var(--hs) / var(--z) + 8px / var(--z));
    left:calc(50% - (var(--hs) + 8px) / var(--z) / 2); top:calc(-48px / var(--z));
    background:#fff; border:calc(3px / var(--z)) solid #e94560 }
  .del-btn { position:absolute; z-index:46; left:calc(-6px / var(--z)); top:calc(-48px / var(--z));
    width:calc(32px / var(--z)); height:calc(32px / var(--z)); border-radius:50%; padding:0;
    background:#e94560; color:#fff; border:none; font-size:calc(18px / var(--z)); line-height:1; cursor:pointer }
  .ui-below .rot { top:auto; bottom:calc(-48px / var(--z)) }
  .ui-below .del-btn { top:auto; bottom:calc(-48px / var(--z)) }
  .cropping .handle, .cropping .rot { display:none }

  /* SELECTION TOOLBAR */
  #sel-toolbar { position:absolute; left:50%; bottom:10px; transform:translateX(-50%); z-index:200;
    display:none; flex-direction:column; gap:6px; padding:6px; background:rgba(22,33,62,.97); border:1px solid #0f3460;
    border-radius:12px; box-shadow:0 6px 24px rgba(0,0,0,.5); max-width:calc(100% - 16px) }
  #sel-toolbar.show { display:flex }
  .tb-row { display:flex; gap:6px; align-items:center; overflow-x:auto; -webkit-overflow-scrolling:touch }
  #sel-toolbar button { background:#0f3460; color:#e0e0e0; padding:6px 10px }
  #sel-toolbar button.on { background:#e94560; color:#fff }
  #sel-toolbar .del { background:#e94560; color:#fff }
  .tb-lbl { display:flex; align-items:center; gap:4px; font-size:13px; color:#aaa; min-height:44px; white-space:nowrap; flex-shrink:0 }
  .tb-lbl input[type=range] { width:110px }
  #sel-toolbar select, #sel-toolbar input[type=number] { min-height:44px; background:#0f3460; color:#e0e0e0; border:none; border-radius:6px; padding:0 8px; font-size:14px; flex-shrink:0 }
  #sel-toolbar input[type=number] { width:64px }
  #sel-toolbar input[type=color] { width:40px; height:36px; border:none; background:none; flex-shrink:0 }
  .text-only, .img-only, .crop-only { display:none !important }
  #sel-toolbar.is-text .text-only { display:flex !important }
  #sel-toolbar.is-img .img-only { display:flex !important }
  #sel-toolbar.cropping .crop-only { display:flex !important }
  #sel-toolbar.cropping .nocrop { display:none !important }

  /* PAGE STRIP */
  #strip { display:flex; align-items:center; gap:8px; padding:6px 12px; background:#131c35; border-top:1px solid #0f3460; flex-shrink:0; height:104px }
  #strip-pages { display:flex; gap:8px; overflow-x:auto; flex:1; align-items:center; height:100%; -webkit-overflow-scrolling:touch; padding:2px }
  .thumb { width:64px; height:91px; position:relative; flex-shrink:0; overflow:hidden; border:2px solid #0f3460; border-radius:4px; cursor:pointer; touch-action:pan-x; background:#fff }
  .thumb.active { border-color:#e94560 }
  .thumb.dragging { z-index:10; opacity:.85; box-shadow:0 6px 20px rgba(0,0,0,.6); transition:none }
  .thumb .thumb-scale { transform:scale(0.1008); transform-origin:0 0; pointer-events:none }
  .thumb .num { position:absolute; right:2px; bottom:2px; font-size:10px; background:rgba(0,0,0,.7); color:#fff; padding:0 4px; border-radius:3px }

  /* FOOTER */
  #footer { display:flex; align-items:center; gap:12px; padding:4px 12px; background:#16213e; border-top:1px solid #0f3460;
    min-height:48px; flex-shrink:0; font-size:13px; color:#888; overflow-x:auto; white-space:nowrap }
  #footer label { display:flex; align-items:center; gap:6px; cursor:pointer; min-height:44px }
  #footer input[type=range] { width:110px }
  #footer input[type=checkbox] { accent-color:#e94560; width:20px; height:20px }
  .snap-label { color:#e94560 }
  #save-status { color:#6c9 }

  @media (pointer:coarse) {
    #canvas { --hs:28px }
    .gallery-item .remove { display:block; width:28px; height:28px; line-height:28px; font-size:18px }
  }
  @media (max-width:900px), (orientation:portrait) {
    #sidebar-toggle { display:inline-block }
    #sidebar { position:absolute; top:0; bottom:0; left:0; z-index:300; width:min(290px,85vw);
      transform:translateX(-100%); transition:transform .2s; box-shadow:4px 0 20px rgba(0,0,0,.5) }
    body.sidebar-open #sidebar { transform:none }
  }
  @media (max-width:600px) { #header h1 { font-size:15px } }

  /* PRINT */
  #print-root { display:none }
  @page { size:595px 842px; margin:0 }
  @media print {
    * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important }
    html, body { height:auto !important; overflow:visible !important; background:#fff !important; padding:0 !important; display:block !important }
    body > *:not(#print-root) { display:none !important }
    #print-root { display:block !important }
    .print-page { width:595px; height:842px; overflow:hidden; break-after:page; page-break-after:always }
    .print-page:last-child { break-after:auto; page-break-after:auto }
  }
</style>
</head>
<body>

<div id="header">
  <button id="sidebar-toggle" class="btn-page" onclick="toggleSidebar()">☰ Tools</button>
  <h1>📰 Magazine Builder</h1>
  <span class="spacer"></span>
  <button id="undo-btn" class="btn-page" onclick="undo()" aria-label="Undo">↶ Undo</button>
  <button id="redo-btn" class="btn-page" onclick="redo()" aria-label="Redo">↷ Redo</button>
  <button class="btn-page" onclick="prevPage()" aria-label="Previous page">◀</button>
  <span id="page-indicator">Page 1 / 1</span>
  <button class="btn-page" onclick="nextPage()" aria-label="Next page">▶</button>
  <button class="btn-page" onclick="addPage()">+ Page</button>
  <button class="btn-page" onclick="duplicatePage()">⧉ Dup page</button>
  <button class="btn-page" onclick="deletePage()">🗑 Page</button>
  <button class="btn-page" onclick="clearPage()">Clear</button>
  <button class="btn-export" onclick="exportPage()">📥 Export</button>
  <button class="btn-export" onclick="exportAll()">📚 Export all</button>
  <button class="btn-page" onclick="newMagazine()">✦ New magazine</button>
</div>

<div id="main">
  <div id="sidebar">
    <h3>📷 Your Images</h3>
    <div class="src-btns">
      <label id="upload-zone" class="src-btn" for="file-input">📷 Photos / Files / Drive</label>
      <button id="gp-btn" class="src-btn" onclick="googlePhotosStart()">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 2a5 5 0 0 1 5 5v5H12z"/><path fill="#FBBC05" d="M22 12a5 5 0 0 1-5 5h-5v-5z"/><path fill="#34A853" d="M12 22a5 5 0 0 1-5-5v-5h5z"/><path fill="#4285F4" d="M2 12a5 5 0 0 1 5-5h5v5z"/></svg>
        Google Photos</button>
      <div id="gp-note" class="gp-note"></div>
    </div>
    <input type="file" id="file-input" multiple accept="image/*" onchange="handleUpload(event)">
    <div id="gallery"></div>

    <h3>🔤 Text</h3>
    <div class="side-row">
      <button class="side-btn" onclick="addText('headline')">Headline</button>
      <button class="side-btn" onclick="addText('caption')">Caption</button>
      <button class="side-btn" onclick="addText('body')">Body</button>
    </div>

    <h3>🎨 Page Background</h3>
    <div class="side-row" id="bg-swatches"></div>
    <div id="bg-picker"></div>

    <h3>📐 Layout Templates</h3>
    <div id="templates"></div>
  </div>

  <div id="canvas-wrapper">
    <div id="canvas-container">
      <div id="canvas" class="pg"></div>
      <div id="drop-hint">Drop image here</div>
    </div>
  </div>

  <div id="sel-toolbar">
    <div class="tb-row">
      <button class="del" onclick="deleteSel()" aria-label="Delete">🗑 Delete</button>
      <span class="nocrop" style="display:flex;gap:6px">
        <button onclick="nudge(-1,0)" aria-label="Nudge left">←</button>
        <button onclick="nudge(0,-1)" aria-label="Nudge up">↑</button>
        <button onclick="nudge(0,1)" aria-label="Nudge down">↓</button>
        <button onclick="nudge(1,0)" aria-label="Nudge right">→</button>
        <button onclick="bringToFront()">⬆ Front</button>
        <button onclick="sendToBack()">⬇ Back</button>
        <button onclick="duplicateEl()" aria-label="Duplicate">⧉</button>
        <label class="tb-lbl">⟳ <input type="range" id="tb-rot" min="-180" max="180" step="1"> <span id="tb-rot-val">0°</span></label>
      </span>
      <button id="tb-crop" class="img-only" onclick="toggleCrop()">✂ Crop</button>
      <label class="tb-lbl crop-only">Zoom <input type="range" id="tb-cropzoom" min="100" max="500" step="1"></label>
      <button class="crop-only" onclick="resetCrop()">Reset</button>
    </div>
    <div class="tb-row text-only">
      <button onclick="enterEdit(sel)">✎ Edit</button>
      <select id="tb-font" aria-label="Font"></select>
      <input type="number" id="tb-size" min="6" max="300" aria-label="Font size">
      <button id="tb-bold" onclick="toggleProp('bold')" aria-label="Bold"><b>B</b></button>
      <button id="tb-italic" onclick="toggleProp('italic')" aria-label="Italic"><i>I</i></button>
      <button data-align="left" onclick="setAlign('left')">⇤</button>
      <button data-align="center" onclick="setAlign('center')">↔</button>
      <button data-align="right" onclick="setAlign('right')">⇥</button>
      <button data-align="justify" onclick="setAlign('justify')">☰</button>
      <label class="tb-lbl">Color <input type="color" id="tb-color"></label>
      <label class="tb-lbl"><input type="checkbox" id="tb-bgon"> Bg</label>
      <input type="color" id="tb-bg" value="#ffffff" aria-label="Background color">
    </div>
  </div>
</div>

<div id="strip">
  <div id="strip-pages"></div>
  <button class="btn-page" onclick="addPage()" aria-label="Add page">+</button>
  <button class="btn-page" onclick="duplicatePage()">⧉ Dup</button>
</div>

<div id="footer">
  <label><input type="checkbox" id="grid-toggle" onchange="toggleGrid()" checked> Grid</label>
  <label><input type="checkbox" id="snap-toggle" onchange="toggleSnap()" checked> <span class="snap-label">Snap</span></label>
  <span>Zoom:</span>
  <input type="range" id="zoom-slider" min="20" max="150" value="85" oninput="setZoom(this.value)">
  <span id="zoom-val">85%</span>
  <button class="btn-page" onclick="fitZoom()">Fit</button>
  <span class="spacer"></span>
  <span id="info-bar">No element selected</span>
  <span id="save-status"></span>
</div>

<div id="drag-ghost"><img alt=""></div>
<div id="print-root"></div>
<div id="gp-panel" role="dialog" aria-modal="true" aria-labelledby="gp-title">
  <div id="gp-box">
    <h4 id="gp-title">Google Photos</h4>
    <div id="gp-msg"></div>
    <div id="gp-bar"><div></div></div>
    <div id="gp-actions"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════
// GOOGLE PHOTOS SETUP — paste your OAuth 2.0 Web client ID here.
// (Google Cloud Console → APIs & Services → Credentials → OAuth client ID,
//  type "Web application"; enable the "Google Photos Picker API";
//  add this site's https origin under "Authorized JavaScript origins".)

    const imgs = {}; used.forEach(id => { if (images[id]) imgs[id] = images[id]; });
    const data = { v:2, pages:clone(pages), cur, galleryIds:[...galleryIds], images:imgs, settings:{...settings} };
    const db = await getDB();
    await new Promise((res, rej) => {

// ───────── ELEMENTS ─────────

// ───────── SELECTION / EDITING ─────────

// ───────── GESTURES ON CANVAS ─────────
const ptrs = new Map();
let op = null, lastTap = null;

canvas.addEventListener('pointerdown', ev => {
  if (ev.pointerType === 'mouse' && ev.button !== 0) return;
  if (ev.target.closest('.del-btn')) return;
  const n = ev.target.closest('.el');
  if (editing && n && n.dataset.id === editing) return; // native caret / selection
  if (editing) exitEdit();
  ev.preventDefault();
  ptrs.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
  if (ptrs.size === 2 && selEl()) { startPinch(); return; }
  if (ptrs.size > 2) return;
  if (!n) { select(null); return; }
  const id = n.dataset.id, wasSel = sel === id;
  if (!wasSel) select(id);
  const e = selEl();
  const base = { id, pid:ev.pointerId, x0:ev.clientX, y0:ev.clientY, orig:clone(e), moved:false, wasSel };
  const h = ev.target.closest('.handle');
  if (ev.target.closest('.rot')) { const b = n.getBoundingClientRect(); op = { ...base, type:'rotate', cx:b.left + b.width / 2, cy:b.top + b.height / 2 }; }

  gpShow('Google Photos', 'Preparing the photo picker…', [gpCancelBtn]);
  try {
    const r = await gpFetch(GP_API + '/sessions', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:'{}' });
    GP.session = await r.json();
  } catch (e) { gpError(e.message); return; }
  if (GP.cancelled) { gpDeleteSession(); return; }
  const uri = GP.session.pickerUri.replace(/\/$/, '') + '/autoclose';
  gpShow('Choose photos',
    'Tap "Open Google Photos", pick your photos, then tap Done. This window will import them automatically.',
    [gpCancelBtn, { label:'Open Google Photos', primary:true, href:uri, id:'gp-open',
      onClick: ev => {
        // open from the tap itself so iPad Safari allows it
        const w = window.open(uri, '_blank');
        if (w) { ev.preventDefault(); GP.win = w; }
        setTimeout(() => gpWaiting(uri), 0);
      } }]);
  gpPoll();
}
function gpWaiting(uri) {
  gpShow('Waiting for your selection…', 'Pick photos in the Google Photos tab and tap Done, then come back here.',
    [gpCancelBtn, { label:'Open again', href:uri, onClick: ev => { const w = window.open(uri, '_blank'); if (w) ev.preventDefault(); } }], { progress:0 });
}
async function gpPoll() {
  clearTimeout(GP.pollTimer);
  if (GP.cancelled || !GP.session) return;
  const started = GP.pollStart || (GP.pollStart = Date.now());
  let s;
  try { s = await (await gpFetch(GP_API + '/sessions/' + encodeURIComponent(GP.session.id))).json(); }
  catch (e) { gpError(e.message); gpDeleteSession(); return; }
  if (GP.cancelled) return;
  if (s.mediaItemsSet) { GP.pollStart = 0; gpImport(); return; }
  const pc = s.pollingConfig || {}, timeout = gpDur(pc.timeoutIn);
  if (timeout === 0 || Date.now() - started > 30 * 60000) {
    GP.pollStart = 0; gpError('The Google Photos session timed out before any photos were picked. Tap Google Photos to try again.'); gpDeleteSession(); return;
  }
  GP.pollTimer = setTimeout(gpPoll, clamp(gpDur(pc.pollInterval) || 3000, 500, 15000));
}
async function gpListItems() {
  const items = []; let pageToken = '';
  do {
    const u = GP_API + '/mediaItems?pageSize=100&sessionId=' + encodeURIComponent(GP.session.id) + (pageToken ? '&pageToken=' + encodeURIComponent(pageToken) : '');
    const j = await (await gpFetch(u)).json();
    items.push(...(j.mediaItems || [])); pageToken = j.nextPageToken || '';
  } while (pageToken && !GP.cancelled);
  return items;
}
function blobToDataURL(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); }); }
function imgSize(src) { return new Promise(res => { const i = new Image(); i.onload = () => res({ w:i.naturalWidth, h:i.naturalHeight }); i.onerror = () => res(null); i.src = src; }); }
async function gpImport() {
  if (GP.win && !GP.win.closed) { try { GP.win.close(); } catch (_) {} }
  gpShow('Importing photos…', 'Getting your selection…', [gpCancelBtn], { progress:0 });
  let items;
  try { items = await gpListItems(); } catch (e) { gpError(e.message); gpDeleteSession(); return; }
  const photos = items.filter(it => (it.type ? it.type === 'PHOTO' : true) && it.mediaFile && it.mediaFile.baseUrl &&
    (!it.mediaFile.mimeType || it.mediaFile.mimeType.startsWith('image/')));
  const skipped = items.length - photos.length;
  let ok = 0, failed = 0;
  for (let k = 0; k < photos.length && !GP.cancelled; k++) {
    const mf = photos[k].mediaFile;
    gpShow('Importing photos…', `Downloading ${k + 1} of ${photos.length}…`, [gpCancelBtn], { progress:k / photos.length });
    try {
      const blob = await (await gpFetch(mf.baseUrl + '=w2048-h2048')).blob();
      const src = await blobToDataURL(blob), dim = await imgSize(src);
      if (!dim) throw new Error('decode');
      const id = uid('g'); images[id] = { src, name:mf.filename || 'Google Photo', w:dim.w, h:dim.h }; galleryIds.push(id); ok++;
      renderGallery(); renderBgControls();
    } catch (e) { failed++; console.warn('Google Photos item failed', e); if (/expired/.test(e.message)) break; }
  }
  if (ok) commit();          // history + autosave
  await gpDeleteSession();
  if (GP.cancelled) return;
  const parts = [`Added ${ok} photo${ok === 1 ? '' : 's'} to Your Images.`];
  if (skipped) parts.push(`${skipped} video${skipped === 1 ? ' was' : 's were'} skipped (only photos are supported).`);
  if (failed) parts.push(`${failed} couldn't be downloaded.`);
  if (!ok && !skipped && !failed) parts[0] = 'No photos were selected.';
  gpShow('Google Photos', parts.join('\n'), [{ label:'Done', primary:true, onClick:gpHide }], { error:!ok && (failed > 0) });
  if (ok) { if (sidebarIsOverlay()) toggleSidebar(true); }
}
async function gpDeleteSession() {
  const s = GP.session; GP.session = null; clearTimeout(GP.pollTimer);
  if (!s || !GP.token) return;
  try { await fetch(GP_API + '/sessions/' + encodeURIComponent(s.id), { method:'DELETE', headers:{ Authorization:'Bearer ' + GP.token } }); } catch (_) {}
}
function gpCancel() { GP.cancelled = true; GP.pollStart = 0; gpHide(); gpDeleteSession(); }
// re-check right away when the user returns from the Google Photos tab
document.addEventListener('visibilitychange', () => { if (!document.hidden && GP.session && !GP.cancelled) gpPoll(); });

// ───────── INIT ─────────
function normalize() {
  pages.forEach(p => {
    if (!p.bg) p.bg = '#ffffff'; if (p.bgImg === undefined) p.bgImg = null; if (!p.els) p.els = [];
    p.els.forEach(e => { if (!e.id) e.id = uid('e'); if (e.rot === undefined) e.rot = 0; if (e.type === 'image' && !e.crop) e.crop = { px:50, py:50, s:1 }; });
  });
}
(async function init() {
  buildTemplates(); gpInitButton();
  try {
    const s = await loadState();
    if (s && Array.isArray(s.pages) && s.pages.length) {
      pages = s.pages; cur = clamp(s.cur || 0, 0, s.pages.length - 1);
      galleryIds = s.galleryIds || []; images = s.images || {};
      settings = { ...settings, ...(s.settings || {}) };
      setStatus('Restored ✓');
    }
  } catch (err) { console.warn('Could not restore', err); }
  normalize();
  $('grid-toggle').checked = settings.grid; $('snap-toggle').checked = settings.snap;
  resetHistory(); renderAll();
  requestAnimationFrame(fitZoom);
  window.__ready = true;
})();
let fitTimer;
window.addEventListener('orientationchange', () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitZoom, 300); });
</script>
